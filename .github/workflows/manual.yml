name: Manual – tester och bygge
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Simulerade tester för Test och Store
        run: python work/run_tests.py
      - name: Bygg test-EXE och osignerat MSIX
        run: python work/build_manual_free.py
      - name: Spara skärmbilder från UI-testerna
        uses: actions/upload-artifact@v4
        with:
          name: manual-1.7-preview
          path: |
            outputs/preview-1.7-huvudfonster-fore-lasning.png
            outputs/preview-1.7-huvudfonster-efter-lasning.png
          if-no-files-found: error
          retention-days: 30
